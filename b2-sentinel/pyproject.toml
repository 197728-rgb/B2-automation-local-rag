[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b2-sentinel"
version = "1.0.0"
description = "B2 SENTINEL - Closed-Loop B-2 Compliance Intelligence System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "B2 SENTINEL" }]
dependencies = [
    "pydantic>=2.5.0",
    "lxml>=4.9.0",
    "pdfplumber>=0.10.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=1.1.0",
    "scikit-learn>=1.3.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "jsonschema>=4.20.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cognitive = [
    "openai>=1.50.0",
    "anthropic>=0.39.0",
]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
b2-sentinel = "b2_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
b2_sentinel = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
