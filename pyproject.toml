[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b2-automation"
version = "0.1.0"
description = "Local AAR audit evidence review for multi-form B-2 DOCX workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
b2 = "b2_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p", "no:cacheprovider"]
