name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Opt into Node.js 24 for JS-based actions; avoids Node 20 deprecation warnings.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then python -m pip install -e .; fi

      - name: Lint with flake8
        run: |
          flake8 src tests scripts --count --select=E9,F63,F7,F82,F401 --show-source --statistics
          flake8 src tests scripts --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest when tests exist
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            python -m pytest -q
          else
            echo "No tests found; skipping pytest."
          fi
